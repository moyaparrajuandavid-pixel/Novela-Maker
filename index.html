<style>
:root{--bg:#0f0c18;--fg:#efe9fa;--card:#1a1526;--card2:#241d35;--ac:#ff5fa2;--ac2:#8b5cf6;--bd:#322a46;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}
#app{max-width:760px;margin:auto;padding:10px 10px 90px}
h1{font-size:24px;margin:8px 0;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
h3{margin:12px 0 6px;font-size:14px;opacity:.8;text-transform:uppercase;letter-spacing:.05em}
button,select,input,textarea{font:inherit;color:var(--fg);background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;max-width:100%}
button{background:linear-gradient(135deg,var(--ac),var(--ac2));border:0;color:#fff;cursor:pointer;font-weight:600}
button.g{background:var(--card2);border:1px solid var(--bd);font-weight:400}button.r{background:#a8324a}
textarea,input[type=text]{width:100%}input[type=color]{padding:0;width:44px;height:36px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}.row>.f{flex:1}
.nav{position:fixed;left:0;right:0;bottom:0;background:#150f20f2;border-top:1px solid var(--bd);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.nav button{background:none;color:#a99dc4;border-radius:12px;flex:1;max-width:110px;font-size:10px;padding:4px 2px;font-weight:400}
.nav button b{display:block;height:36px}.nav img{width:34px;height:34px;object-fit:contain;filter:grayscale(.35) opacity(.7);transition:transform .2s,filter .2s}.nav .on img{filter:drop-shadow(0 0 7px #ff5fa2);transform:scale(1.18) translateY(-2px)}.nav .on{color:#fff;background:var(--card2)}
.th{display:flex;flex-wrap:wrap;gap:10px}.th>div{width:104px;font-size:11px;text-align:center}
.th img{width:104px;height:70px;object-fit:contain;background:#0006;border-radius:10px;display:block;margin-bottom:4px}
.pj{display:flex;gap:10px;align-items:center;padding:0;overflow:hidden}.pj .cv{width:96px;height:64px;background:linear-gradient(135deg,var(--ac2),var(--ac)) center/cover}.pj b{flex:1}.pj button{margin-right:8px}
.ln{display:flex;gap:8px;padding:8px;border:1px solid var(--bd);border-radius:10px;margin:4px 0;background:var(--card);font-size:13px}.ln.on{border-color:var(--ac);background:var(--card2)}.ln span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1}
.modal{position:fixed;inset:0;background:#000e;z-index:9;padding:10px;display:flex;flex-direction:column;gap:8px;align-items:center;overflow:auto}
canvas{max-width:100%;touch-action:none;background:#333}small{opacity:.65}
details summary{cursor:pointer;font-weight:600}
.map{position:relative;overflow:auto;max-height:60vh;background:#120d1f;border-radius:12px;border:1px solid var(--bd)}
.nd{position:absolute;border:3px solid;border-radius:10px;background:#241d35 center/cover;overflow:hidden;cursor:pointer;color:#fff;font-size:10px;box-sizing:border-box}.nd .ov2{position:absolute;inset:0;opacity:.35}.nd b{position:absolute;top:2px;left:4px;background:#000a;border-radius:6px;padding:0 5px;font-size:11px}.nd span{position:absolute;bottom:0;left:0;right:0;background:#000a;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:1px 3px}
.nd.on{box-shadow:0 0 0 3px var(--ac),0 0 14px var(--ac)}.nd.tg{animation:pls 1s infinite}@keyframes pls{50%{transform:scale(1.07)}}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid #fff;display:inline-block;flex:none}.cr{display:flex;gap:8px;align-items:center;padding:6px;border:1px solid var(--bd);border-radius:10px;margin:4px 0;cursor:pointer}.cr span.t{flex:1;font-size:13px}
.hd{position:absolute;border:2px dashed var(--ac);background:#ff5fa233;touch-action:none;cursor:move}.hd span{position:absolute;top:2px;left:4px;font-size:11px;color:#fff;pointer-events:none;text-shadow:0 1px 3px #000}.hd .rz{position:absolute;right:2px;bottom:2px;width:28px;height:28px;border-radius:50%;background:var(--ac);border:2px solid #fff}
</style></head><body><div id="app"></div><div class="nav" id="nav" hidden></div>

const PCSS=`.vn{position:relative;width:100%;aspect-ratio:var(--ar,16/9);max-width:calc(100vh*var(--arn,1.7778));max-height:100vh;background:#111 center/cover;overflow:hidden;font-family:system-ui,sans-serif;color:#fff;user-select:none;margin:auto}
.vn .bg{position:absolute;inset:0;background:center/cover}.vn .ch{position:absolute;bottom:0;height:88%;object-fit:contain}
.vn .box{position:absolute;left:3%;right:3%;bottom:3%;background:var(--bx);border:2px solid #fff3;border-radius:var(--rd);padding:10px 14px;min-height:28%;font-size:clamp(12px,2.6vw,20px);color:var(--tc);font-family:var(--ff)}
.vn .who{font-weight:700;color:var(--nc);margin-bottom:4px}.vn .tx{white-space:pre-wrap}
.vn .ov{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;background:#0008;padding:10px;text-align:center}
.vn button{background:linear-gradient(135deg,#ff5fa2,#8b5cf6);color:#fff;border:0;border-radius:10px;padding:8px 18px;font-size:clamp(12px,2.8vw,18px);min-width:46%;cursor:pointer}
.vn .sm{position:absolute;top:6px;right:6px;min-width:0;padding:4px 10px;opacity:.8}
.vn h2{margin:0;font-size:clamp(20px,6vw,44px);text-shadow:0 2px 8px #000}
.vn input[type=text]{padding:8px;border-radius:8px;border:0;width:70%}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-6%)}}@keyframes slide{from{transform:translateX(-30%);opacity:0}to{transform:none;opacity:1}}
.vn .st{position:absolute;inset:0}.vn.fx-shake .st{animation:shk .5s}.vn.fx-zoom .bg{animation:zm 8s forwards}.vn.fx-dim .bg{filter:brightness(.4)}
.vn .fl,.vn .tr{position:absolute;inset:0;pointer-events:none;animation:out .9s forwards}.vn .fl{background:#fff}.vn .tr.b{background:#000;animation-duration:1.2s}.vn .tr.w{background:#fff;animation-duration:1.2s}
.vn .pt{position:absolute;top:-8%;pointer-events:none;animation:fall linear infinite}.vn .pt.rain{width:2px;height:16px;background:#9cd4ff99}.vn .pt.snow{width:6px;height:6px;border-radius:50%;background:#fff}.vn .pt.petal{width:10px;height:8px;border-radius:0 100% 0 100%;background:#ffb3d1}
.vn .tx.shout{font-weight:800;font-size:1.3em;color:#ff6b6b;animation:shk .4s}.vn .tx.whisper{font-size:.85em;font-style:italic;opacity:.75}
@keyframes shk{0%,100%{transform:translate(0)}20%{transform:translate(-10px,4px)}40%{transform:translate(9px,-5px)}60%{transform:translate(-7px,-3px)}80%{transform:translate(6px,5px)}}
@keyframes out{to{opacity:0}}@keyframes zm{to{transform:scale(1.15)}}@keyframes fall{to{top:108%}}
.vn .ia{animation:ia 2.6s forwards;font-size:clamp(14px,4vw,28px);letter-spacing:.1em;line-height:1.5}.vn .ia small{display:block;opacity:.7;margin-bottom:6px}@keyframes ia{0%{opacity:0}20%,80%{opacity:1}100%{opacity:0}}
.vn .av{position:absolute;top:50%;transform:translateY(-50%);height:78%;aspect-ratio:1;object-fit:cover;object-position:top;border:2px solid var(--nc);background:#0006}.vn .av.c{border-radius:50%}.vn .av.al{left:2%}.vn .av.ar{right:2%}.vn .box.al{padding-left:21%}.vn .box.ar{padding-right:21%}.vn .box.hide{display:none}.vn .box{box-sizing:border-box}
.vn .ob{position:absolute;z-index:2;cursor:pointer}.vn .ob img{width:100%;height:100%;object-fit:contain;pointer-events:none}.vn.ed .ob{outline:2px dashed #ff5fa2;background:#ff5fa233}.vn .sg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:94%;max-height:72%;overflow:auto}.vn .sl{background:#0009;border:1px solid #fff4;border-radius:8px;padding:3px;cursor:pointer;font-size:10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.vn .sl img,.vn .sl .ph{width:100%;aspect-ratio:var(--ar,16/9);object-fit:cover;display:flex;align-items:center;justify-content:center;background:#222;border-radius:5px}
.vn .bk{right:50px}.vn .sm{z-index:5}
.vn .hud{position:absolute;top:6px;left:6px;z-index:4;display:flex;flex-direction:column;gap:3px;font-size:clamp(9px,2.2vw,13px);pointer-events:none}.vn .hv{background:#0009;border-radius:8px;padding:2px 6px;display:flex;align-items:center;gap:5px;min-width:90px}.vn .hv img{height:1.5em}.vn .hv .bar{flex:1;height:7px;background:#fff3;border-radius:4px;overflow:hidden;min-width:60px}.vn .hv .bar i{display:block;height:100%;transition:width .4s}
.vn .pop{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-weight:800;text-shadow:0 2px 6px #000;animation:pop 1.2s forwards;z-index:7;pointer-events:none;white-space:nowrap}@keyframes pop{to{transform:translate(-50%,-60px);opacity:0}}
.vn .ov{overflow-y:auto;justify-content:safe center}.vn .pa{position:absolute;transform:translate(-50%,-50%);text-align:center;width:max-content;max-width:92%}
.vn .stk{position:sticky;bottom:0;flex:none}.vn .back{position:absolute;top:6px;left:6px;min-width:0;padding:6px 12px;z-index:6}.vn .orow{display:flex;align-items:center;gap:8px;width:92%;font-size:clamp(11px,2.8vw,16px)}.vn .orow span{flex:0 0 40%;text-align:right}.vn .orow input{flex:1;min-width:0}
.vn .vd{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vn .tmb{position:absolute;left:10%;right:10%;top:12px;height:6px;background:#ff5fa2;border-radius:4px;transform-origin:left;animation:tm linear forwards}@keyframes tm{to{transform:scaleX(0)}}
.vn .tl{position:absolute;bottom:4px;left:0;right:0;font-size:10px;opacity:.7;text-decoration:underline;cursor:pointer;text-align:center}
.vn.gr{background:repeating-conic-gradient(#2d56a8 0 25%,#1e3d7d 0 50%) 0 0/36px 36px}`;
